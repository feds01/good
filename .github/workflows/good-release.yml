name: Release good

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full SHA of a commit on the good branch
        required: true
        type: string

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GO_VERSION: '1.27.3'
      SHA: ${{ inputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: good
          fetch-depth: 0
          persist-credentials: false

      - name: Check the commit is on the good branch
        run: |
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "sha must be a full 40-character lowercase SHA" >&2
            exit 1
          fi
          git merge-base --is-ancestor "$SHA" origin/good

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build
        run: scripts/build-dist.sh "$SHA" dist

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ./dist/checksums.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="good-${SHA:0:12}"
          gh release create "$tag" dist/*.tar.gz dist/checksums.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "$tag" \
            --notes "Built from $SHA by scripts/build-dist.sh. Verify with: gh attestation verify <file> --repo $GITHUB_REPOSITORY"
